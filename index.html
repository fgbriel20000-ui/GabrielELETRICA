<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS Elétrica — Instalações e Manutenções Elétricas</title>
<meta name="description" content="GS Elétrica: orçamentos, instalações e manutenções elétricas residenciais e comerciais em Natal/RN.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F3A">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">

<style>
    /* ===== Estilos específicos do painel inicial ===== */
    body { padding-top: var(--gs-altura-header); }

    @media (min-width: 861px) {
        main, #gs-footer { margin-left: var(--gs-largura-sidebar); }
    }

    .painel-topo {
        background: linear-gradient(135deg, var(--gs-azul-profundo) 0%, var(--gs-azul) 100%);
        color: var(--gs-branco);
        padding: 2.5rem 0 2rem;
    }
    .painel-eyebrow {
        color: var(--gs-amarelo);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.85rem;
        margin-bottom: 0.4rem;
    }
    .painel-topo h1 { color: var(--gs-branco); font-size: clamp(1.7rem, 4vw, 2.4rem); margin-bottom: 1.25rem; }

    .resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .resumo-item.destaque { grid-column: 1 / -1; }
    .resumo-item.destaque strong { font-size: 1.6rem; color: var(--gs-amarelo); }
    .resumo-item {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: var(--gs-raio);
        padding: 0.8rem 0.9rem;
    }
    .resumo-item span { display: block; color: #C9D4E8; font-size: 0.78rem; margin-bottom: 0.2rem; }
    .resumo-item strong { font-family: var(--gs-fonte-titulo); font-size: 1.25rem; color: var(--gs-branco); }

    .secao { padding: 2rem 0 0.5rem; }
    .secao:last-of-type { padding-bottom: 3rem; }
    .secao h2 { font-size: 1.2rem; margin-bottom: 1rem; }

    .grade-atalhos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
    .atalho {
        display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
        text-align: center; text-decoration: none; color: var(--gs-texto);
        border-top: 3px solid var(--gs-amarelo);
        padding: 1.25rem 0.75rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .atalho:hover { transform: translateY(-3px); box-shadow: var(--gs-sombra-media); }
    .atalho .icone {
        width: 48px; height: 48px; border-radius: 50%;
        background: rgba(245, 180, 0, 0.14);
        display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
    }
    .atalho strong { font-size: 0.95rem; }

    .orcamento-linha {
        display: flex; justify-content: space-between; align-items: center; gap: 1rem;
        padding: 0.75rem 0; border-bottom: 1px solid var(--gs-borda);
    }
    .orcamento-linha:last-child { border-bottom: none; }
    .orcamento-linha small { display: block; color: var(--gs-texto-claro); }
    .orcamento-linha .valor { font-weight: 700; white-space: nowrap; }
    .lista-vazia { text-align: center; color: var(--gs-texto-claro); padding: 1.5rem 0.5rem; }
    .lista-vazia .btn { margin-top: 1rem; text-decoration: none; }
</style>
</head>
<body data-base="./" data-pagina="inicio">

<div id="gs-header"></div>
<div id="gs-sidebar"></div>

<main>
    <section class="painel-topo">
        <div class="container">
            <p class="painel-eyebrow">⚡ GS Elétrica</p>
            <h1 id="saudacao">Painel</h1>
            <div class="resumo">
                <div class="resumo-item destaque"><span>Total orçado no mês</span><strong id="resumo-total">R$ 0,00</strong></div>
                <div class="resumo-item"><span>Orçamentos no mês</span><strong id="resumo-qtd">0</strong></div>
                <div class="resumo-item"><span>Clientes</span><strong id="resumo-clientes">0</strong></div>
            </div>
        </div>
    </section>

    <div class="faixa-eletrica"></div>

    <section class="secao">
        <div class="container">
            <h2>Atalhos</h2>
            <div class="grade-atalhos">
                <a class="card atalho" href="paginas/orcamentos.html"><span class="icone">📋</span><strong>Novo orçamento</strong></a>
                <a class="card atalho" href="paginas/clientes.html"><span class="icone">👥</span><strong>Clientes</strong></a>
                <a class="card atalho" href="paginas/agenda.html"><span class="icone">📅</span><strong>Agenda</strong></a>
                <a class="card atalho" href="paginas/calculadoras.html"><span class="icone">🧮</span><strong>Calculadoras</strong></a>
                <a class="card atalho" href="paginas/mais.html"><span class="icone">⚙️</span><strong>Recibos e mais</strong></a>
            </div>
        </div>
    </section>

    <section class="secao">
        <div class="container">
            <h2>Últimos orçamentos</h2>
            <div class="card" id="ultimos-orcamentos"></div>
        </div>
    </section>
</main>

<div id="gs-footer"></div>
<div id="gs-modal-slot"></div>

<script src="js/componentes.js"></script>
<script>
(function () {
    function ler(chave) {
        try { return JSON.parse(localStorage.getItem(chave) || '[]'); } catch (e) { return []; }
    }
    function moeda(v) {
        return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    const hora = new Date().getHours();
    document.getElementById('saudacao').textContent = hora < 12 ? 'Bom dia!' : hora < 18 ? 'Boa tarde!' : 'Boa noite!';

    const historico = ler('gs-historico-orcamentos');
    const clientes = ler('gs-clientes');

    // Resumo do mês (a data fica no formato dd/mm/aaaa, hh:mm)
    const hoje = new Date();
    const doMes = historico.filter(function (o) {
        const m = String(o.data || '').match(/(\d{2})\/(\d{2})\/(\d{4})/);
        return !!m && Number(m[2]) === hoje.getMonth() + 1 && Number(m[3]) === hoje.getFullYear();
    });
    document.getElementById('resumo-qtd').textContent = doMes.length;
    document.getElementById('resumo-total').textContent = moeda(doMes.reduce(function (s, o) {
        return s + Number((o.servico && o.servico.valor) || 0);
    }, 0));
    document.getElementById('resumo-clientes').textContent =
        Array.isArray(clientes) ? clientes.length : Object.keys(clientes || {}).length;

    // Últimos 5 orçamentos
    const caixa = document.getElementById('ultimos-orcamentos');
    if (!historico.length) {
        caixa.innerHTML = '<div class="lista-vazia">Nenhum orçamento ainda.<br><a class="btn btn-primario" href="paginas/orcamentos.html">Fazer o primeiro orçamento</a></div>';
        return;
    }
    historico.slice(0, 5).forEach(function (o) {
        const linha = document.createElement('div');
        linha.className = 'orcamento-linha';

        const esquerda = document.createElement('div');
        const titulo = document.createElement('strong');
        titulo.textContent = (o.cliente && o.cliente.nome) || 'Sem nome';
        const sub = document.createElement('small');
        sub.textContent = 'Nº ' + (o.numero || '—') + ' · ' + (o.data || '');
        esquerda.appendChild(titulo);
        esquerda.appendChild(sub);

        const valor = document.createElement('span');
        valor.className = 'valor';
        valor.textContent = moeda(o.servico && o.servico.valor);

        linha.appendChild(esquerda);
        linha.appendChild(valor);
        caixa.appendChild(linha);
    });
})();
</script>

</body>
</html>
